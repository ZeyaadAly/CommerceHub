name: CommerceHub CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: commercehub-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout validation tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm and dependency store cache
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Verify exact runtime versions
        run: |
          node --version
          pnpm --version
          node -e "const fs=require('node:fs'); if(process.version !== 'v'+fs.readFileSync('.node-version','utf8').trim()) process.exit(1); if(require('./package.json').packageManager !== 'pnpm@11.28.6') process.exit(1)"
          test "$(pnpm --version)" = '11.28.6'
      - name: Scan PR changes for credential signatures
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/secret-scan.mjs
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Validate CI policy and scanner
        run: pnpm test:ci
      - name: Check formatting
        run: pnpm format:check
      - name: CH-P0-005 isolated negative lint fixture
        run: |
          printf '%s\n' 'const deliberatelyUnused = 1;' 'export {};' > scripts/CH-P0-005-negative-lint.mjs
      - name: Lint all workspaces
        run: pnpm lint
      - name: Strict TypeScript
        run: pnpm typecheck
      # Existing export tests require shared dist entrypoints, so build first.
      - name: Build all seven workspaces
        run: pnpm build
      - name: Existing and tooling tests
        run: pnpm test
      - name: Explicit tooling verification
        run: pnpm test:quality
      - name: Dependency security audit and scoped exception validation
        run: pnpm audit:ci
